# Pinned versions of the lint/check toolchain: the one place to bump them, and
# what Renovate bumps. bin/install_check_tools.sh installs these on Linux
# (CI, cloud sessions); on a workstation `mise install` here does the same.
# Each tool names its backend explicitly so Renovate can map it to a
# datasource without relying on mise's registry aliases.
# Tools also used outside this repo (actionlint, gitleaks, yq, lefthook,
# shellcheck) stay in Brewfile.extra too: a mise shim falls through to the brew
# binary in a directory without this config.
[tools]
"aqua:biomejs/biome" = "2.5.10"
"aqua:editorconfig-checker/editorconfig-checker" = "3.11.2"
"aqua:evilmartians/lefthook" = "2.2.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:sethvargo/ratchet" = "0.12.0"
"aqua:zizmorcore/zizmor" = "1.30.1"
# Runs the pipx: tools below (mise's pipx backend uses uvx when uv is present),
# so they do not depend on whether the host ships pipx.
"aqua:astral-sh/uv" = "0.12.22"
# The interpreter the pipx: tools install into. Without `python =` uv picks
# whatever python3 is on PATH, and a release too new for pyyaml's wheels fails
# to build. The patch version is written out so Renovate proposes each one;
# the tools name only the minor, so their venvs follow it through mise's 3.14
# link instead of being rebuilt. mise resolves them outside this directory, so
# that minor must also be the global one in config/mise/config.toml.
"core:python" = "3.14.8"
"pipx:check-jsonschema" = { version = "0.38.0", python = "3.14" }
"pipx:yamllint" = { version = "1.38.0", python = "3.14" }
