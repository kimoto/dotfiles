---
# mkworld.sh on a Mac, all the way to platform: Brewfile.macos's casks and
# setup_macosx.sh run nowhere else in CI. The runner image ships Homebrew
# already, so this proves the bundles and the climb, not the Homebrew install.
#
# A macOS runner costs nothing on a public repo but is slow, so this runs only
# when a change can move the result, plus weekly for Homebrew drifting under us.
# That weekly run is the one that installs every formula for real; a PR run
# restores the formulae a previous run installed (see the Cellar cache below)
# and only installs what the Brewfiles changed since, plus the casks.
name: bootstrap-macos
on:
  pull_request:
    paths:
      - "Brewfile.*"
      - "bin/mkworld.sh"
      - "bin/mklink.sh"
      - "bin/prune_claude_links.sh"
      - "bin/setup_homebrew.sh"
      - "bin/setup_macosx.sh"
      - "bin/setup_brew_auto_upgrade.sh"
      - "ci/brew_cellar_cache.sh"
      - ".github/workflows/bootstrap-macos.yml"
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: macos-26
    # A cold run downloads every bottle and cask; a few times that.
    timeout-minutes: 90
    env:
      # Keep the downloads the cache below saves: brew prunes them after an
      # install otherwise.
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Identify the runner image
        id: image
        # The OS release (macos26) goes into each cache key: Homebrew bottles
        # and compiled plugins built on one release break on the next.
        run: echo "os=${ImageOS:?}" >>"$GITHUB_OUTPUT"

      # The download cache, not /opt/homebrew: the image's own prefix is large
      # and not ours to snapshot. A hit skips the network, not the install, so
      # the install path still runs for real every time.
      - name: Restore Homebrew downloads
        id: cache-brew
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/Homebrew
          key: >-
            ${{ steps.image.outputs.os }}-brew-dl-${{ hashFiles('Brewfile.standard',
            'Brewfile.extra', 'Brewfile.macos') }}-v2
          restore-keys: ${{ steps.image.outputs.os }}-brew-dl-

      - name: Restore tmux plugins
        id: cache-tmux-plugins
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.tmux/plugins
          key: ${{ steps.image.outputs.os }}-tmux-plugins-${{ hashFiles('.tmux.conf') }}-v1

      # The installed formulae themselves (Cellar directories plus their
      # links), not just the downloads: with the downloads cached, the ~4
      # minutes a run spends are unpacking and installing. Keyed per set of
      # formulae the runner ships (below), per week so outdated formulae are
      # reinstalled from scratch at most a week late, and per Brewfile so an
      # edit falls back (restore-keys) to the previous set and installs only
      # the difference. Never on the weekly schedule: that run is what proves
      # the install path still works.
      - name: Week, for the Cellar cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"

      # Runners of one image version do not all ship the same formulae, and an
      # archive restored onto a runner that already has some of its formulae
      # mixes versions or stops tar. The hash keeps each archive to runners
      # that shipped exactly what its saver did.
      - name: List the formulae the image ships
        id: image-formulae
        run: |
          brew list --formula | sort >"$RUNNER_TEMP/formulae-before.txt"
          # Versions too: an archive linked against one version of an image
          # formula breaks on a runner that ships another.
          echo "hash=$(brew list --formula --versions | sort | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"

      # Some runners of the same image link openssl@3 although Homebrew marks it
      # keg-only; its bin/openssl then stops openssl@4 (a dependency of bat)
      # from linking. `brew bundle` never touches a formula no Brewfile
      # names, so nothing else drops that link. Only openssl@3: the image links
      # other keg-only formulae (node@24, ruby@3.4) on purpose.
      - name: Unlink the image's openssl@3
        run: |
          if [ -e "$(brew --prefix)/var/homebrew/linked/openssl@3" ]; then
            brew unlink openssl@3
          fi

      - name: Restore installed formulae
        id: cache-cellar
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.temp }}/cellar.tar
          # The archive format version sits before the week: restore-keys
          # match by prefix, so a version at the end would never invalidate.
          key: >-
            ${{ steps.image.outputs.os }}-cellar-v2-${{ steps.image-formulae.outputs.hash }}-${{
            steps.week.outputs.week }}-${{ hashFiles('Brewfile.standard', 'Brewfile.extra') }}
          restore-keys: >-
            ${{ steps.image.outputs.os }}-cellar-v2-${{ steps.image-formulae.outputs.hash }}-${{
            steps.week.outputs.week }}-

      - name: Unpack the restored formulae
        if: steps.cache-cellar.outputs.cache-matched-key != ''
        run: ./ci/brew_cellar_cache.sh restore "$RUNNER_TEMP/cellar.tar"

      # Other runners carry a bin/openssl symlink of the image's own (absolute,
      # into opt/openssl@3) while brew records openssl@4 as linked. brew owns
      # neither that file nor a link record for openssl@3, so the step above
      # and `brew link --overwrite` both leave it, and it stops openssl@4 from
      # linking. Remove just that file. After the restore, so a restored
      # openssl@4 gets relinked too.
      - name: Drop the image's own bin/openssl
        run: |
          prefix="$(brew --prefix)"
          target="$(readlink "$prefix/bin/openssl" || true)"
          echo "bin/openssl -> ${target:-not a link}"
          case "$target" in
            */openssl@3/*)
              rm "$prefix/bin/openssl"
              if [ -d "$prefix/Cellar/openssl@4" ]; then
                brew unlink openssl@4
                brew link openssl@4
              fi
              ;;
          esac

      - name: mkworld reaches platform
        run: MKWORLD_EXPECT=platform ./bin/mkworld.sh

      # Everything on top of what the image ships: the list was taken before
      # the restore, so what was restored counts too and the archive is the
      # full set. The cache is a bonus on top of a bootstrap that already passed, so a
      # pack that fails must not turn the job red; it only costs the next run.
      - name: Pack the installed formulae
        id: pack
        if: steps.cache-cellar.outputs.cache-hit != 'true' && github.event_name != 'schedule'
        continue-on-error: true
        run: |
          brew list --formula | sort >"$RUNNER_TEMP/formulae-after.txt"
          added="$RUNNER_TEMP/formulae-added.txt"
          comm -13 "$RUNNER_TEMP/formulae-before.txt" "$RUNNER_TEMP/formulae-after.txt" >"$added"
          ./ci/brew_cellar_cache.sh save "$RUNNER_TEMP/cellar.tar" "$added"

      - name: Save installed formulae
        if: steps.pack.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.temp }}/cellar.tar
          key: ${{ steps.cache-cellar.outputs.cache-primary-key }}

      # Saved even when mkworld failed: a partial download set still spares the
      # next run, and nothing installed is in it. Not when cancelled, though: an
      # exact key hit is never saved over, so a set cut short would stick until
      # a Brewfile changes.
      - name: Save Homebrew downloads
        if: (success() || failure()) && steps.cache-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ steps.cache-brew.outputs.cache-primary-key }}

      - name: Save tmux plugins
        if: steps.cache-tmux-plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.tmux/plugins
          key: ${{ steps.cache-tmux-plugins.outputs.cache-primary-key }}

      - name: zsh starts clean with the full toolchain
        env:
          DOTFILES_NO_SYNC_CHECK: "1"
          DOTFILES_NO_BREW_CHECK: "1"
          DOTFILES_NO_MISE_CHECK: "1"
        run: |
          out="$(zsh -i -c 'ls >/dev/null && ll >/dev/null && print ZSH_OK' 2>&1)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -E 'command not found|not found:|No such file|parse error'; then
            exit 1
          fi
          printf '%s\n' "$out" | grep -q ZSH_OK

  # Only the weekly run installs every formula for real (a PR or manual run
  # restores the Cellar cache), so only its passes count toward `stable`, the
  # commit README's install line starts a new machine from, and only once they
  # are a week old.
  advance-stable:
    needs: platform
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the move itself uses STABLE_TOKEN, see below
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Fast-forward stable to the newest pass at least a week old
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_TOKEN can never hold the workflows permission, and GitHub refuses
          # to move a branch onto commits that change .github/workflows without it.
          # A fine-grained PAT for this repo only: Contents and Workflows, read-write.
          STABLE_TOKEN: ${{ secrets.STABLE_TOKEN }}
        run: |
          set -e
          sha="$(./ci/aged_pass.sh bootstrap-macos.yml 7 schedule)"
          if [ -z "$sha" ]; then
            echo "no passing run a week old yet; stable stays where it is"
            exit 0
          fi
          GH_TOKEN="$STABLE_TOKEN" ./ci/advance_stable.sh "$sha"
