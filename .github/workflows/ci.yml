---
name: ci
on:
  push: {}
  workflow_dispatch: {}
  # A push only ever restores the Homebrew cache keyed on Brewfile.standard's
  # hash, so a green push proves nothing about whether that cached tmux/zsh
  # still matches what Homebrew serves today (#272). This weekly run skips
  # the restore in zsh_loading_test to force a real install, and every other
  # job is skipped for this trigger since only that job touches brew.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each timeout is a few times the job's slowest run, so a hang stops there
# instead of at the 6-hour default: 20 where Homebrew may install from cold
# (~5 min), 10 for the rest (~1 min).
jobs:
  static_checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install check tools
        run: ./bin/install_check_tools.sh
        env:
          # mise resolves aqua/github tools through the GitHub API, which
          # rate-limits an unauthenticated runner.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint shell scripts
        run: ./bin/lint_shell.sh
      - name: Run unit tests (bats)
        run: ./bin/run_tests.sh
      - name: Lint zsh syntax
        run: ./bin/lint_zsh.sh
      - name: Lint lua syntax
        run: ./bin/lint_lua.sh
      - name: Lint bash syntax
        run: ./bin/lint_bash.sh
      - name: Validate config files
        run: ./bin/lint_config.sh
      - name: Validate config schemas
        run: ./bin/lint_schema.sh
      - name: Check editorconfig (line length, whitespace, final newline)
        run: ./bin/lint_editorconfig.sh
      - name: Lint YAML style (yamllint)
        run: ./bin/lint_yaml.sh
      - name: Lint workflows (ratchet pinning + actionlint)
        run: ./bin/lint_actions.sh
      - name: Check Brewfile sort
        run: ./bin/check_brewfile_sort.sh
      - name: Check tools catalog (TOOLS.md) is in sync with the Brewfiles
        run: ./bin/gen_tools_list.sh --check
      - name: Check KEYBINDINGS.md against config/ghostty/config and .aerospace.toml
        run: ./bin/check_keybindings.sh
      - name: Check AGENTS.md stays an index (size cap)
        run: ./bin/check_agents_size.sh
      - name: Check for sensitive filenames
        run: ./bin/check_secret_files.sh
      - name: Scan for secrets (gitleaks)
        run: gitleaks git --no-banner --redact
      - name: Check commit messages (Conventional Commits)
        # Same rule as the lefthook commit-msg hook, applied to every commit on
        # this branch — catches --no-verify and web-UI commits that bypass the
        # local hook. Needs the fetch-depth: 0 checkout above for origin/main.
        run: ./bin/check_commit_msgs_range.sh

  windows_codex_setup:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Test Codex config merge
        shell: pwsh
        run: ./test/link_codex.ps1

  # mise picks each tool's release asset for the host arch, and the Claude Code
  # web sandbox that runs bin/install_check_tools.sh via the SessionStart hook
  # can be arm64. Every other job covers x86_64 only; this one downloads
  # the arm64 assets and exercises each installed binary for real via the lint
  # scripts that depend on it.
  toolchain_arm64:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    # Below the usual 10: this is a required check, and an arm64 runner has been
    # seen to take the job and never start a step, holding the PR for the whole
    # timeout. 3 is still several times its ~45s worst run.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install check tools (arm64 release assets)
        run: ./bin/install_check_tools.sh
        env:
          # mise resolves aqua/github tools through the GitHub API, which
          # rate-limits an unauthenticated runner.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Exercise the toolchain (yq+biome, check-jsonschema, ratchet, ec)
        run: |
          ./bin/lint_config.sh
          ./bin/lint_schema.sh
          ./bin/lint_yaml.sh
          ./bin/lint_actions.sh
          ./bin/lint_editorconfig.sh
          gitleaks version
          lefthook version

  zsh_loading_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Restore Homebrew cache
        id: cache-brew
        # Skipped on the weekly schedule trigger so this job installs brew
        # for real instead of restoring a snapshot (#272) — a hit here would
        # test whatever Homebrew served on the day the cache was last built,
        # not today's.
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /opt/homebrew
            /home/linuxbrew/.linuxbrew
          # The cache holds Brewfile.standard plus tmux, which ci/prepare.sh
          # installs on demand because it lives in Brewfile.extra; the -tmux
          # suffix forces a rebuild that bakes it in. Bump the vN to evict a
          # bad cache or when the set of extra brew installs changes.
          key: ${{ runner.os }}-brew-${{ hashFiles('Brewfile.standard') }}-tmux-v5

      - name: Restore tmux plugins cache
        id: cache-tmux-plugins
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          # tpm clones every @tpm_plugins entry into here; cache them so later
          # runs skip the clones. Keyed on .tmux.conf since that is where the
          # plugin list lives — editing it re-resolves the plugin set. Bump the
          # vN to evict a bad cache (same manual lever as the brew key).
          path: ~/.tmux/plugins
          key: ${{ runner.os }}-tmux-plugins-${{ hashFiles('.tmux.conf') }}-v1

      - name: Prepare world (cache phase)
        # One entry point owns the installs (Homebrew + Brewfile.standard,
        # then mkworld for symlinks/hooks/tpm plugins). BREW_CACHE_HIT lets it
        # skip the brew work on a hit; the actions/cache restore/save stay in YAML.
        run: ./ci/prepare.sh
        env:
          BREW_CACHE_HIT: ${{ steps.cache-brew.outputs.cache-hit }}

      - name: Save Homebrew cache
        # Save only on a cache miss (saving on a hit re-uses the same key and
        # fails with "Cache already exists"). No always(): if the prepare step
        # failed, skip the save so a half-installed tree never poisons the cache.
        # Also skipped on schedule: the restore above never ran, so this would
        # otherwise overwrite the push-triggered cache with the cold run's own.
        if: github.event_name != 'schedule' && steps.cache-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /opt/homebrew
            /home/linuxbrew/.linuxbrew
          key: ${{ steps.cache-brew.outputs.cache-primary-key }}

      - name: Save tmux plugins cache
        if: github.event_name != 'schedule' && steps.cache-tmux-plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.tmux/plugins
          key: ${{ steps.cache-tmux-plugins.outputs.cache-primary-key }}

      - name: Install check tools
        # This job installs Brewfile.standard only, and bats-core is in
        # Brewfile.extra — so the suite below has no runner without this. The
        # whole toolchain rather than bats alone: the lint_*.bats cases drive
        # the real binaries and fail rather than skip when one is missing.
        run: ./bin/install_check_tools.sh
        env:
          # mise resolves aqua/github tools through the GitHub API, which
          # rate-limits an unauthenticated runner.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Unit tests (bats) with the dotfiles linked into $HOME
        # Deliberately a second run of the same suite static_checks runs: that
        # job has a pristine $HOME, this one has just been through mkworld, so
        # ~/.gitconfig is the repo's. That difference is a whole class of bug —
        # fixtures inheriting commit.gpgsign = true and a signing key no runner
        # holds the secret half of, which fails on every fresh machine and on no
        # CI job. Seconds to run, so it stays per-push rather than monthly.
        run: ./bin/run_tests.sh

      - name: Load to test .zshrc
        run: ./test/e2e/zsh_loading_test.sh

      # ~1 min per run, so not on every branch push: record on main (one data
      # point per merged commit, comparable over time) and on manual dispatch.
      # Record-only — a slow-startup budget that fails the build is a separate,
      # future check.
      - name: Benchmark zsh startup (timing loop -> job summary + artifact)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: ./ci/zsh_bench.sh

      - name: Upload zsh startup bench results
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zsh-startup-bench
          path: ${{ runner.temp }}/zsh-startup-bench.txt

      - name: Load to test .tmux.conf
        run: ./test/e2e/tmux_loading_test.sh

      - name: Interactive e2e (drive a real terminal, assert on rendered screen)
        run: ./test/e2e/tmux_interactive_test.sh

      - name: Interactive e2e for tmux key bindings (nested tmux, assert binds fire)
        run: ./test/e2e/tmux_keybinding_test.sh

      - name: Interactive e2e for tmux copy-mode (select + yank)
        run: ./test/e2e/tmux_copymode_test.sh

      - name: e2e for the status bar and dynamic window/pane formats
        run: ./test/e2e/tmux_status_test.sh

      - name: e2e for the Claude Code tmux state indicator (hook script + formats)
        run: ./test/e2e/claude_tmux_indicator_test.sh

      - name: e2e for the hook that keeps a hunk pane on Claude's repo
        run: ./test/e2e/claude_tmux_hunk_test.sh

      - name: Starship prompt e2e (render in a real terminal, assert segments)
        run: ./test/e2e/starship_test.sh

      - name: Interactive e2e for the g repo-jump command (ghq -> fzf -> cd)
        run: ./test/e2e/g_command_test.sh

      - name: Interactive e2e for the w worktree-jump command (git worktree -> fzf -> cd)
        run: ./test/e2e/w_command_test.sh

      - name: Interactive e2e for the keybinding cheatsheet (zsh ^X? + tmux prefix+?)
        run: ./test/e2e/keys_command_test.sh

      - name: Interactive e2e for completion candidate colours (list-colors)
        run: ./test/e2e/completion_colors_test.sh

  # zsh_loading_test runs whatever tmux the brew cache holds, and that cache only
  # rebuilds when Brewfile.standard changes, so it stays on an old release for
  # months. That old one is worth keeping: it catches config an older tmux cannot
  # parse. This job runs the tmux suite again on Homebrew's current release,
  # where the newer-only bindings are actually live. Its own job rather than a
  # second pass in that one: the two cannot share one tmux on PATH.
  tmux_latest_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Restore Homebrew cache
        id: cache-brew
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /opt/homebrew
            /home/linuxbrew/.linuxbrew
          # Same key as zsh_loading_test, which owns saving it.
          key: ${{ runner.os }}-brew-${{ hashFiles('Brewfile.standard') }}-tmux-v5

      - name: Restore tmux plugins cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.tmux/plugins
          key: ${{ runner.os }}-tmux-plugins-${{ hashFiles('.tmux.conf') }}-v1

      - name: Prepare world (cache phase)
        run: ./ci/prepare.sh
        env:
          BREW_CACHE_HIT: ${{ steps.cache-brew.outputs.cache-hit }}

      - name: Upgrade tmux to Homebrew's current release
        # Fails rather than passes when the upgrade leaves tmux below 3.8: every
        # 3.8-only case skips itself on an older tmux, so this job would go green
        # while testing the same release as zsh_loading_test.
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew upgrade tmux
          v="$(tmux -V | awk '{ print $2 }')"
          echo "== tmux $v =="
          if ! printf '%s\n' 3.8 "$v" | sort -V -C; then
            echo "::error::tmux $v is older than 3.8"
            exit 1
          fi

      - name: Load to test .tmux.conf
        run: ./test/e2e/tmux_loading_test.sh

      - name: Interactive e2e (drive a real terminal, assert on rendered screen)
        run: ./test/e2e/tmux_interactive_test.sh

      - name: Interactive e2e for tmux key bindings (nested tmux, assert binds fire)
        run: ./test/e2e/tmux_keybinding_test.sh

      - name: Interactive e2e for tmux copy-mode (select + yank)
        run: ./test/e2e/tmux_copymode_test.sh

      - name: e2e for the status bar and dynamic window/pane formats
        run: ./test/e2e/tmux_status_test.sh

      - name: e2e for the Claude Code tmux state indicator (hook script + formats)
        run: ./test/e2e/claude_tmux_indicator_test.sh

      - name: e2e for the hook that keeps a hunk pane on Claude's repo
        run: ./test/e2e/claude_tmux_hunk_test.sh

      - name: Interactive e2e for the keybinding cheatsheet (zsh ^X? + tmux prefix+?)
        run: ./test/e2e/keys_command_test.sh

  # The standard-phase gate from docs/staged-bootstrap.md: zsh_loading_test
  # above also runs mkworld.sh (tmux plugins, Claude hooks, lefthook), so a
  # break in Brewfile.standard alone would still pass it. This job installs
  # nothing beyond Brewfile.standard plus the symlinks and checks that the
  # shell still loads on its own.
  zsh_loading_test_standard_only:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Homebrew + Brewfile.standard only
        run: SKIP_BREWFILE_EXTRA=1 ./bin/setup_homebrew.sh

      - name: Symlink dotfiles (stage 0, no network)
        run: ./bin/mklink.sh

      - name: Load to test .zshrc (Brewfile.standard only)
        run: ./test/e2e/zsh_loading_test.sh

  # The minimal and basic phases: distro bash, zsh and vim only, as a non-root
  # user, so the config must work before any extra tool is installed.
  plain_shell_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: debian:stable-slim
    steps:
      - name: Install the distro shells only
        run: |
          apt-get update
          # curl so mkworld really tries the Homebrew installer and is refused
          # for want of sudo, the way a locked-down account refuses it.
          apt-get install -y --no-install-recommends ca-certificates curl git zsh vim
          useradd --create-home tester

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: mkworld stops at minimal without zsh, and at basic without sudo
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- ./test/e2e/mkworld_phase_test.sh minimal
          runuser -u tester -- ./test/e2e/mkworld_phase_test.sh basic

      - name: bash and zsh start clean without the rich tools
        run: runuser -u tester -- ./test/e2e/plain_shell_test.sh

  vim_guard_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Ensure vim + neovim + tmux are present
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vim neovim tmux

      - name: Legacy .vimrc guard (no-plugin startup must be clean)
        run: ./test/e2e/vim_guard_test.sh

      - name: Neovim config guard (pure-Lua config loads clean, no plugins)
        run: ./test/e2e/nvim_guard_test.sh

  nvim_loading_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Ensure tmux is present
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux

      - name: Install Neovim (upstream stable tarball)
        # apt ships 0.9.x, but the real environment runs the latest brew nvim
        # and the config carries 0.12+ API usage (vim.pack in
        # setup_plugin.lua), so test against
        # upstream's stable channel — the same thing brew tracks.
        run: |
          set -e
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sfn /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Restore nvim plugins cache
        id: cache-nvim-plugins
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          # test/e2e/nvim_loading_test.sh points XDG_DATA_HOME here (via
          # NVIM_E2E_DATA_DIR), so this holds the vim.pack clones of every
          # plugin. Keyed on the plugin list and the lockfile that pins each
          # revision — changing either re-resolves the plugin set. Bump the vN to
          # evict a bad cache (same manual lever as the brew/tmux keys).
          path: ~/.nvim-e2e-data
          key: >-
            ${{ runner.os }}-nvim-plugins-${{ hashFiles('config/nvim/lua/kimoto/setup_plugin.lua',
            'config/nvim/nvim-pack-lock.json') }}-v1

      - name: Neovim e2e (install all plugins, assert clean startup)
        run: NVIM_E2E_DATA_DIR="$HOME/.nvim-e2e-data" ./test/e2e/nvim_loading_test.sh

      - name: Save nvim plugins cache
        # Runs only when the e2e passed (a failed step stops the job), so a
        # half-installed tree never poisons the cache; skip on hit because
        # saving over the same key fails with "Cache already exists".
        if: steps.cache-nvim-plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nvim-e2e-data
          key: ${{ steps.cache-nvim-plugins.outputs.cache-primary-key }}
