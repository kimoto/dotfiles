# Exact versions, not "latest": whatever was newest on install day would reach
# every machine unreviewed. Renovate's mise manager proposes each bump in its
# monthly PR once the release is a week old; a repo that needs something newer
# says so in its own mise.toml.
[tools]
bun = "1.4.3"
go = "1.27.3"
node = "26.12.0"
# The repo's pipx: tools ask for this minor version, and mise resolves them
# outside the repo, where only this file names a python.
python = "3.14"
rust = "1.99.1"

[settings]
idiomatic_version_file_enable_tools = ["node"]
