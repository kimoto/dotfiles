# NOTE: keybindings in this file are documented in KEYBINDINGS.md (repo
# root) — update it when adding or changing a binding.
set-option -g prefix C-t
# prefix + C-t jumps back to the previous window (double-tap the prefix); the
# send-prefix it displaces is re-bound to C-b after tpm runs
bind-key C-t last-window
set-option -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
# killing the last window of a session jumps to another session instead of detaching
set-option -g detach-on-destroy off

setw -g mode-keys vi
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
# yank into the system clipboard: pbcopy (macOS) / wl-copy (Wayland) /
# xclip (X11); when none exist (headless), OSC52 via set-clipboard still works
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || true"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi '[' send-keys -X previous-prompt
bind-key -T copy-mode-vi ']' send-keys -X next-prompt

bind-key Right join-pane -t :+
bind-key Left join-pane -t :-

# command+1 ~ 9でwindow切り替え (like chrome)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-t new-window

# pane navigation (like vim hjkl)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-z resize-pane -Z

# type into every pane of the window at once (status-right shows ⚠ SYNC while on)
bind-key e setw synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"

# command+option+←/→でwindow移動
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# command+option+↑/↓でsession移動
bind-key -n M-Up switch-client -p
bind-key -n M-Down switch-client -n

# pane move: m でmark → M で移動
bind-key M join-pane -s .

bind-key r source-file ~/.tmux.conf \; display-message "config reloaded"

# popups: g = lazygit, t = throwaway shell (replaces the default clock-mode)
bind-key g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" lazygit
bind-key t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
# tmux 3.7+: rebind g/t to floating panes instead of popups. Popups are modal
# — prefix bindings (extrakto, copy mode) don't work inside them — while a
# floating pane is a regular pane, so prefix keys reach it. Never script a
# resize: resize-pane on a float shrinks the tiled pane behind it (3.7b)
if-shell 'v=$(tmux -V | sed -En "s/^tmux ([0-9]+)\.([0-9]+).*/\1 \2/p"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 7 ]; }' \
  'bind-key g new-pane -c "#{pane_current_path}" lazygit; bind-key t new-pane -c "#{pane_current_path}"'

# f = fzf switcher across every pane of every session, with a live preview
# (replaces the default find-window); switch-client accepts a pane target.
# Ordered most-recently-used first from @mru (stamped by the hooks near the
# bottom of this file); the pane it was opened from is dropped, so the top
# entry is always the pane to jump back to. A popup has no TMUX_PANE of its
# own, hence asking the server which pane is current.
# Label: pane title, falling back to the pane's cwd while the title is still
# the default hostname (no program has set one)
bind-key f display-popup -E -w 90% -h 70% 'cur=$(tmux display-message -p "#{pane_id}"); tmux list-panes -a -f "#{!=:#{pane_id},$cur}" -F "#{?@mru,#{@mru},0} #S:#I.#P  #W  #{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{b:pane_current_path},#{pane_title}}" | sort -rn | cut -d" " -f2- | fzf --reverse --prompt="switch> " --preview "tmux capture-pane -ep -t {1}" --preview-window "right,60%" | { read -r sel; [ -n "$sel" ] && tmux switch-client -t "${sel%%  *}"; }'

# toggle the status bar (handy for screen sharing)
bind-key b set-option status


set -g set-titles on
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{&&:#{==:#{window_panes},1},#{!=:#{pane_title},#{host_short}}},#{pane_title},#{b:pane_current_path}}'
setw -g allow-rename off
set -g mouse on
set -g history-limit 50000

# tmux 3.6+ のみ適用（古い tmux では unknown option を避けるためスキップ）
if-shell 'v=$(tmux -V | sed -En "s/^tmux ([0-9]+)\.([0-9]+).*/\1 \2/p"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 6 ]; }' \
  "set -g default-client-command attach; set -g pane-scrollbars on; set -g pane-scrollbars-position right; set -g pane-scrollbars-style 'fg=#2aa198'"
set -g default-terminal "xterm-256color"
set -as terminal-features '*:RGB'
set -as terminal-features '*:hyperlinks'
set -as terminal-features '*:clipboard'
set -as terminal-overrides ',xterm-256color:RGB'
set -g set-clipboard on
# pass modified keys (Shift+Enter etc.) through to apps when the outer
# terminal supports CSI u / modifyOtherKeys (Ghostty does)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g @tpm_plugins ' \
  tmux-plugins/tpm \
  tmux-plugins/tmux-sensible \
  tmux-plugins/tmux-pain-control \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
  jaclu/tmux-menus \
  laktak/extrakto \
  sainnhe/tmux-fzf \
  nhdaly/tmux-better-mouse-mode \
  timvw/tmux-assistant-resurrect \
'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @extrakto_copy_key "tab"
set -g @extrakto_insert_key "enter"
set -g @extrakto_fzf_unset_default_opts "false"
set -g @extrakto_split_direction "v"
set -g @extrakto_fzf_layout "reverse"
set -g @extrakto_help_key "esc" # disabled
set -g @extrakto_edit_key "ctrl-v" # disabled
set -g @extrakto_filter_key "ctrl-g" # disabled for emacs keybind
set -g @extrakto_grab_key "ctrl-h" # = disabled for emacs keybind
set -g @extrakto_grab_area "window full"
set -g @extrakto_filter_order "line word quote"

# Status bar - Solarized Dark Powerline
set -g status-style "bg=#073642,fg=#839496"
set -g message-style "bg=#073642,fg=#2aa198"
set -g message-command-style "bg=#073642,fg=#2aa198"
set -g status-left-length 50
set -g status-right-length 100
# One dot per session, filled while that session has a client. #{S:...}
# loops over the sessions as a format, so it costs no process — the shell
# job it replaced re-ran `tmux list-sessions` on every status redraw. The
# segment fg is re-asserted after the loop: the last dot leaves its own.
set -g status-left "#[fg=#002b36,bg=#{?client_prefix,#b58900,#268bd2},bold] #{S:#{?session_attached,#[fg=#fdf6e3]●,#[fg=#002b36]•}}#[fg=#002b36] #{session_name} #[fg=#{?client_prefix,#b58900,#268bd2},bg=#073642,nobold] "
# The kube context comes from a job that sleeps between prints rather than
# a fresh `kubectl config current-context` on every redraw: tmux keeps one
# job per #() string and respawns it only once it exits, so this is one
# ~35ms lookup a minute instead of one per status-interval.
set -g status-right "#{?pane_synchronized,#[fg=#dc322f bg=#073642 bold]⚠ SYNC #[nobold],}#[fg=#859900,bg=#073642]#[fg=#002b36,bg=#859900,bold] ⎈ #(while :; do kubectl config current-context 2>/dev/null; sleep 60; done) #[fg=#268bd2,bg=#859900]#[fg=#002b36,bg=#268bd2,bold] %F %R "
# Claude Code state indicator: bin/claude_tmux_indicator.sh tags panes with
# @claude_state (waiting=red #dc322f, done=yellow #b58900, red wins); the
# hooks below recompute the window color when panes move or die. Deferred via
# run-shell -b, and the status formats read only the plain @claude_color:
# evaluating #{P:} mid-command or at draw time crashes tmux 3.7. Bell keeps
# priority; with no state set the formats render exactly as before.
set -g @claude_win_color '#{?#{m:*waiting*,#{P:#{@claude_state}}},#dc322f,#{?#{m:*done*,#{P:#{@claude_state}}},#b58900,}}'
set-hook -ga window-layout-changed 'run-shell -b "tmux set-option -wF -t \"#{window_id}\" @claude_color \"##{E:@claude_win_color}\""'
set-hook -ga window-linked 'run-shell -b "tmux set-option -wF -t \"#{window_id}\" @claude_color \"##{E:@claude_win_color}\""'
setw -g window-status-format "#[fg=#{?window_bell_flag,#dc322f,#{?#{@claude_color},#{@claude_color},#586e75}},bg=#073642]#{?#{@claude_color},#[bold],} #I:#W#{?window_zoomed_flag, 🔍,}#{?#{@claude_color}, ✳,} "
setw -g window-status-current-format "#[fg=#073642,bg=#{?#{@claude_color},#{@claude_color},#2aa198}]#[fg=#002b36,bg=#{?#{@claude_color},#{@claude_color},#2aa198},bold] #I:#W#{?window_zoomed_flag, 🔍,}#{?#{@claude_color}, ✳,} #[fg=#{?#{@claude_color},#{@claude_color},#2aa198},bg=#073642]"
setw -g window-status-separator ""

# '~/.tmux/plugins/tpm/tpm' returned 127 (on macOS, w/ tmux installed using brew)
# https://github.com/tmux-plugins/tpm/blob/master/docs/tpm_not_working.md
# Prepend the brew dir instead of replacing PATH, so ~/.local/bin etc. survive.
# Split per platform: a nonexistent /home/linuxbrew entry in PATH makes every
# command lookup stat /home, which on macOS is an autofs mount that can fire a
# Directory Services (AD) lookup per stat. uname keeps the probe stat-free.
if-shell 'test "$(uname)" = Linux' \
  'set-environment -g PATH "/home/linuxbrew/.linuxbrew/bin:$PATH"' \
  'set-environment -g PATH "/opt/homebrew/bin:$PATH"'
run '~/.tmux/plugins/tpm/tpm'

bind-key Space next-layout

# send-prefix for nested tmux, on C-b — the key C-t replaced. After tpm
# because tmux-sensible unbinds C-b whenever it still holds this exact
# default binding, which is precisely what we want to keep.
bind-key C-b send-prefix

# extrakto overlays a third of the window in a floating pane instead of
# splitting it: the text being picked comes from the pane underneath, so a
# real split squeezes the very thing you are reading. It lands on whichever
# half the cursor is NOT in — pick from a pane in the bottom half and the
# picker opens at the top — so it never covers the lines you were reading.
# tpm binds Tab when the plugin loads, hence after the tpm run above.
# run-shell expands #{pane_id} to the source pane (new-pane's own
# shell-command is not format-expanded) and leaves the % of a percentage
# alone, unlike display-message, which feeds its argument to strftime.
# The comparison must be e|<| — plain #{<:} compares as text, where
# row 7 does not come before row 24.
# -x 100% is rejected — a float needs room for its border.
if-shell 'v=$(tmux -V | sed -En "s/^tmux ([0-9]+)\.([0-9]+).*/\1 \2/p"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 7 ]; }' {
  bind-key Tab run-shell 'tmux new-pane -x 98% -y 30% -X 1% \
    -Y #{?#{e|<|:#{e|+|:#{pane_top},#{cursor_y}},#{e|/|:#{window_height},2}},66%,2%} \
    "tmux setw remain-on-exit off; ~/.tmux/plugins/extrakto/extrakto_plugin.py #{pane_id} split"'
}

# Solarized pane styling (after tpm to override plugin defaults)
set-option -g pane-border-status top
set-option -g pane-border-format " ###{pane_index}: #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}} "
set-option -g pane-border-lines heavy
set-option -g pane-border-style "fg=#2c4a52"
set-option -g pane-active-border-style "fg=#2aa198"
# copy-mode selection color (all versions; on 3.6+ copy-mode-selection-style below wins)
set -g mode-style "fg=#002b36,bg=#2aa198"
# popups (prefix+f, tmux-fzf, tmux-menus) sit above the pane, so they take the
# status bar's base02 rather than the pane background they cover
set -g popup-style "bg=#073642,fg=#839496"
set -g popup-border-style "fg=#2aa198"
set -g popup-border-lines rounded
# copy-mode search: every hit yellow, the one under the cursor orange, and a
# mark (copy-mode M) magenta — all readable against the cyan selection above
set -g copy-mode-match-style "bg=#b58900,fg=#002b36"
set -g copy-mode-current-match-style "bg=#cb4b16,fg=#002b36,bold"
set -g copy-mode-mark-style "bg=#d33682,fg=#002b36"
# tmux 3.6+ のみ適用（古い tmux では unknown option を避けるためスキップ）
# menu-*: Solarized colors for menus (tmux-menus etc.), selection included;
# copy-mode-position-style: the [n/m] scroll indicator; prompt-cursor-*: theme
# colored bar cursor at the command prompt
if-shell 'v=$(tmux -V | sed -En "s/^tmux ([0-9]+)\.([0-9]+).*/\1 \2/p"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 6 ]; }' \
  'set -g copy-mode-selection-style "bg=#2aa198,fg=#002b36"; set -g menu-style "bg=#073642,fg=#839496"; set -g menu-border-style "fg=#2aa198"; set -g menu-selected-style "bg=#2aa198,fg=#002b36,bold"; set -g copy-mode-position-style "bg=#073642,fg=#2aa198"; set -g prompt-cursor-colour "#2aa198"; set -g prompt-cursor-style bar'

# tmux 3.7+ only: copy-mode-line-numbers hybrid = absolute number on the
# cursor line, relative elsewhere (for vi-style 5k/3j jumps), dimmed to base01
# with the cursor line picked out; get-clipboard both = also relay pane
# clipboard requests to the outer terminal (OSC52 read)
if-shell 'v=$(tmux -V | sed -En "s/^tmux ([0-9]+)\.([0-9]+).*/\1 \2/p"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 7 ]; }' \
  'set -g copy-mode-line-numbers hybrid; set -g get-clipboard both; set -g copy-mode-line-number-style "fg=#586e75"; set -g copy-mode-current-line-number-style "fg=#b58900,bold"'
set-option -g window-style "bg=default"
set-option -g window-active-style "bg=default"

# activity フラグを window 切り替え時にリセット
set-hook -g after-select-window "set-option -w monitor-activity off; set-option -w monitor-activity on"

# @mru: a monotonic per-pane focus counter, read back by the prefix+f switcher
# to order panes most-recently-used first. Pure formats, so moving between
# panes costs no fork; the alias keeps the three hooks from repeating it.
set -g command-alias[100] 'mru-stamp=set -pF @mru "#{e|+|:#{?@mru_seq,#{@mru_seq},0},1}" ; set -sF @mru_seq "#{@mru}"'
set-hook -ga after-select-pane mru-stamp
set-hook -ga after-select-window mru-stamp
set-hook -ga client-session-changed mru-stamp

# Claude Code: tmux 内で通知・タイトル変更を有効化
set -g allow-passthrough on
set -g monitor-activity off
set -g visual-activity off
set -g monitor-bell on
setw -g window-status-activity-style "fg=#b58900,bold"
setw -g window-status-bell-style "fg=#dc322f,bold"

source-file -q ~/.tmux.conf.local
